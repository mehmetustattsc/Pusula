name: Test ve yayın
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Soru bankası ve bilgi kartları
        run: node tools/check-questions.js
      - name: Derle
        run: node tools/build.js
      - name: Otomatik oyun testi (bütün haritalar)
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
          python3 tools/test-autoplay.py tr:classic:normal:2 de:quick:normal:3 eu:football:normal:4 asia:classic:hard:2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
