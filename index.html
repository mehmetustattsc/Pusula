<style>
/* Layout: a war-room table — header, three player plaques, the map as the board, a status line, question cards rise as overlays */
:root{
  --bg:#0A0F1A; --panel:#121A2B; --panel2:#18223A; --line:#26324C;
  --fg:#E9EDF5; --muted:#8E9AB2; --gold:#F2C14E; --gold-ink:#1A1405;
  --good:#46C489; --bad:#E5484D;
  --you:#2BB3C0; --p1:#E0565B; --p2:#9B7BEA;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:1.45rem;letter-spacing:.06em;line-height:1}
.brand small{display:block;font-family:var(--body);font-stretch:100%;font-weight:500;font-size:.68rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.phase{margin-left:auto;font-family:var(--mono);font-size:.78rem;color:var(--gold);border:1px solid #3a3320;background:#1d1a10;padding:4px 10px;border-radius:999px;white-space:nowrap}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langs button{background:none;border:0;padding:5px 10px;font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.05em}
.langs button[aria-pressed="true"]{background:var(--panel2);color:var(--fg)}

.players{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pc{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;transition:box-shadow .2s,opacity .3s}
.pc.active{box-shadow:0 0 0 2px var(--c) inset,0 0 18px -6px var(--c)}
.pc.out{opacity:.4}
.pc .nm{font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:6px;min-width:0}
.pc .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .sc{font-family:var(--mono);font-weight:600;font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.1}
.pc .sc small{font-size:.65rem;color:var(--muted);font-weight:500;margin-left:3px}
.pips{display:inline-flex;gap:3px}
.pips i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.pips i.down{background:transparent;box-shadow:0 0 0 1px #4a5570 inset}
.pc .meta{font-size:.68rem;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.pc .meta b{color:var(--fg);font-weight:600}

.board{position:relative;background:#0E1626;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mapscroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}
.mapscroll canvas{display:block;width:100%;height:auto;touch-action:pan-x pan-y}
.mapscroll.zoom canvas{min-width:640px}
.zoomb{position:absolute;right:8px;bottom:8px;background:rgba(10,15,26,.85);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:.72rem;color:var(--fg)}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);opacity:0;pointer-events:none;background:rgba(10,15,26,.92);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.82rem;font-weight:600;max-width:calc(100% - 24px);text-align:center;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}

.status{display:flex;flex-direction:column;gap:2px;min-height:3.2em}
.status .m{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:1.12rem;text-wrap:balance}
.status .s{color:var(--muted);font-size:.88rem}

.legend{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.78rem;color:var(--muted)}
.legend .lt{text-transform:uppercase;letter-spacing:.1em;font-size:.66rem;width:100%}
.badge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#0B111D;box-shadow:0 0 0 2px var(--k) inset;color:var(--k);font-weight:700;font-size:.62rem;letter-spacing:0;flex:none}
.lg{display:inline-flex;align-items:center;gap:6px;color:var(--fg)}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(4,7,13,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.card{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px -20px #000;animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
.qh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.78rem}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;font-size:.68rem;color:var(--k)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--k)}
.qh .ctx{margin-left:auto;color:var(--muted);font-weight:500}
.ctx b{color:var(--fg)}
.timer{height:4px;background:var(--panel2);border-radius:4px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);transform-origin:left;transition:none}
.qt{font-size:1.18rem;font-weight:600;line-height:1.35;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opt{display:flex;align-items:center;gap:10px;text-align:left;min-height:52px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-weight:500}
.opt:not(:disabled):hover{border-color:#3b4a6b}
.opt:disabled{cursor:default}
.opt .l{font-family:var(--mono);font-size:.75rem;color:var(--muted);flex:none}
.opt .tx{flex:1;min-width:0}
.opt .who{display:flex;gap:3px;flex:none}
.opt .who i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--panel2)}
.opt.ok{border-color:var(--good);background:#123325}
.opt.no{border-color:var(--bad);background:#3a1518}
.opt.pick{border-color:var(--gold)}
.res{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem}
.res span{display:inline-flex;align-items:center;gap:6px}
.res .d{width:9px;height:9px;border-radius:50%;background:var(--c)}
.res .y{color:var(--good);font-weight:600}.res .n{color:var(--bad);font-weight:600}
.hint{font-size:.74rem;color:var(--muted);text-align:center}

.disp{font-family:var(--mono);font-size:2rem;font-weight:600;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:3.2rem;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.disp .u{font-size:1rem;color:var(--muted);margin-left:6px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{min-height:50px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;font-family:var(--mono);font-size:1.25rem;font-weight:600}
.pad .go{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-family:var(--body);font-size:.95rem;font-weight:700}
.truth{text-align:center}
.truth .v{font-family:var(--mono);font-size:2rem;font-weight:600;color:var(--gold)}
.truth .lb{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:8px 10px;border-left:3px solid var(--c);font-size:.9rem}
.row .rk{font-family:var(--mono);color:var(--muted)}
.row .g{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.row .df{font-family:var(--mono);font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.row.first{background:#1d2a20}

.ord{display:flex;flex-direction:column;gap:6px}
.oi{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;text-align:left;font-weight:500}
.oi .n{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-family:var(--mono);font-size:.8rem;background:var(--bg);color:var(--muted);flex:none}
.oi.set .n{background:var(--gold);color:var(--gold-ink)}
.oi.ok{border-color:var(--good)}.oi.no{border-color:var(--bad)}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.8rem;color:var(--muted);align-self:flex-start}

.cta{background:var(--gold);color:var(--gold-ink);border:0;border-radius:10px;padding:13px 18px;font-weight:700;font-size:1rem}
.hero h1{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:2.4rem;letter-spacing:.05em;line-height:1;margin:0}
.hero p{margin:6px 0 0;color:var(--muted)}
.hero .qu{margin-top:12px;color:var(--gold);font-style:italic;font-size:.92rem;border-left:2px solid var(--gold);padding-left:10px}
.hero .qu span{display:block;font-style:normal;font-size:.72rem;color:var(--muted);margin-top:2px;letter-spacing:.06em}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:r}
.rules li{display:grid;grid-template-columns:26px 1fr;gap:8px;font-size:.9rem;counter-increment:r}
.rules li::before{content:counter(r);font-family:var(--mono);font-size:.75rem;color:var(--gold);border:1px solid #3a3320;border-radius:6px;height:22px;display:grid;place-items:center}
.cardtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.endt{font-family:var(--display);font-stretch:118%;font-weight:900;font-size:1.8rem;line-height:1.05}
@media (prefers-reduced-motion:reduce){.card{animation:none}.toast{transition:none}}
</style>

</div>
<div class="ov" id="ov" hidden><div class="card" id="card"></div></div>

async function askMC(q,pids,ctxHtml){

  const opts=shuffle(q.a.map((a,i)=>({a,ok:i===0})));const okIdx=opts.findIndex(o=>o.ok);
  const bot={};pids.filter(p=>p!==0).forEach(p=>{const ok=Math.random()<accOf(p,q.c);let idx=okIdx;if(!ok){const w=[0,1,2,3].filter(i=>i!==okIdx);idx=w[Math.floor(Math.random()*3)]}bot[p]=idx});
  showCard(`<div class="qh">${chip(q.c)}<span class="ctx">${ctxHtml}</span></div><div class="timer"><i id="tb"></i></div><div class="qt">${esc(T(q.q))}</div>
   <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}" ${human?'':'disabled'}><span class="l">${'ABCD'[i]}</span><span class="tx">${esc(T(o.a))}</span><span class="who"></span></button>`).join('')}</div><div id="foot"></div>`);
  let hi=null;
  if(human){const tm=timer(15000,$('#tb'));await Promise.race([tm.p,new Promise(res=>card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{hi=+b.dataset.i;b.classList.add('pick');res()}))]);tm.cancel()}
  else{const tm=timer(1600,$('#tb'));await tm.p}
  card.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===okIdx)b.classList.add('ok');else if(i===hi)b.classList.add('no');
    const w=pids.filter(p=>(p===0?hi:bot[p])===i);b.querySelector('.who').innerHTML=w.map(dot).join('')});
  const res={};pids.forEach(p=>res[p]=p===0?hi===okIdx:bot[p]===okIdx);
  $('#foot').innerHTML=(human&&hi==null?`<div class="hint">${t('timeout')}</div>`:'')+resLine(pids,res)+`<div class="hint">${t('tapSkip')}</div>`;
  await waitOrTap(human?2600:1900);return res;
}

  let val='';
  showCard(`<div class="qh">${chip(q.c)}<span class="ctx">${label}${ctxHtml?' · '+ctxHtml:''}</span></div><div class="timer"><i id="tb"></i></div><div class="qt">${esc(T(q.q))}</div><div id="body">
   ${human?`<div class="disp" id="disp">&nbsp;</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button data-n="del" aria-label="del">⌫</button><button data-n="0">0</button><button class="go" data-n="go">${t('send')}</button></div><div class="hint">${t('estHint')}</div>`:`<div class="hint">${t('estHint')}</div>`}</div>`);
  if(human){const tm=timer(15000,$('#tb'));const disp=$('#disp');
    const upd=()=>disp.innerHTML=(val?esc(fmtN(+val,year)):'&nbsp;')+(unit?`<span class="u">${esc(unit)}</span>`:'');upd();
    await Promise.race([tm.p,new Promise(res=>card.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{const n=b.dataset.n;if(n==='go'){if(val)res()}else if(n==='del')val=val.slice(0,-1);else if(val.length<9)val=(val==='0'?'':val)+n;upd()}))]);
    guesses[0]={v:val===''?null:+val,tm:tm.el()};tm.cancel()}
  else{const tm=timer(1700,$('#tb'));await tm.p}
  const rank=pids.slice().sort((a,b)=>{const da=guesses[a].v==null?Infinity:Math.abs(guesses[a].v-q.v),db=guesses[b].v==null?Infinity:Math.abs(guesses[b].v-q.v);return da-db||guesses[a].tm-guesses[b].tm});
  $('#body').innerHTML=`<div class="truth"><div class="lb">${t('answer')}</div><div class="v">${fmtN(q.v,year)}${unit?` <span style="font-size:1rem;color:var(--muted)">${esc(unit)}</span>`:''}</div></div>
   <div class="rows">${rank.map((p,k)=>{const g=guesses[p];return `<div class="row${k===0?' first':''}" style="--c:${G.players[p].color}"><span class="rk">${k+1}</span><span>${esc(pname(p))}</span><span class="g">${g.v==null?t('noAnswer'):fmtN(g.v,year)}</span><span class="df">${g.v==null?'':t('diff')+' '+fmtN(Math.abs(g.v-q.v),year)} · ${g.tm.toFixed(1)}s</span></div>`}).join('')}</div><div class="hint">${t('tapSkip')}</div>`;
  await waitOrTap(human?3400:2400);return rank;
}

/* ===================== game flow ===================== */
function allowedFor(pid){const free=new Set(freeR());const adj=new Set();owned(pid).forEach(r=>ADJ[r].forEach(n=>{if(free.has(n))adj.add(n)}));return adj.size?[...adj]:[...free]}
function targetsFor(pid){const s=new Set();owned(pid).forEach(r=>ADJ[r].forEach(n=>{const o=G.regions[n].owner;if(o>=0&&o!==pid&&G.players[o].alive)s.add(n)}));return [...s]}
function setActive(pid){G.active=pid;renderPlayers()}
async function pickRegion(pid,left){
  const allowed=allowedFor(pid);if(!allowed.length)return;setActive(pid);
  let r;
  if(pid===0){setStatus(()=>[left>1?t('pick2'):t('pick1'),t('pickHint')]);setHL(allowed);scrollToRegions(allowed);r=await waitRegionTap(allowed)}
  else{setStatus(()=>[t('botPick',{p:pname(pid)}),'']);setHL(allowed);await sleep(650);
    const P=G.players[pid];r=allowed.map(i=>({i,s:P.p[G.regions[i].cat]+ADJ[i].filter(n=>G.regions[n].owner<0).length*.04+Math.random()*.25})).sort((a,b)=>b.s-a.s)[0].i;
    setHL([],r);await sleep(450)}
  G.regions[r].owner=pid;clearHL();redrawAll();toast(t('picked',{p:pname(pid),r:G.regions[r].name}));
}
async function duel(a,d,ri){
  const R=G.regions[ri];const q=nextDuel(R.cat);
  const ctxH=`<b style="color:${G.players[a].color}">${esc(pname(a))}</b> → <b style="color:${G.players[d].color}">${esc(pname(d))}</b> · ${esc(R.name)}${R.castle?' · '+t('castle'):''}`;
  const res=q.type==='ord'?await askOrder(q,[a,d],ctxH):await askMC(q,[a,d],ctxH);
  if(res[a]&&!res[d])return 'att';if(res[d]&&!res[a])return 'def';if(!res[a]&&!res[d])return 'none';
  toast(t('tie'));const rk=await askEst(nextEst(),[a,d],t('tiebreak'),ctxH);return rk[0]===a?'att':'def';
}
async function attackTurn(pid){
  setActive(pid);const tg=targetsFor(pid);
  if(!tg.length){setStatus(()=>[t('noTarget',{p:pname(pid)}),'']);await sleep(900);return}
  let ri;
  if(pid===0){setStatus(()=>[t('yourTurn'),t('attackHint')]);setHL(tg);scrollToRegions(tg);ri=await waitRegionTap(tg)}
  else{setStatus(()=>[t('botTurn',{p:pname(pid)}),'']);setHL(tg);await sleep(700);const P=G.players[pid];
    ri=tg.map(i=>{const R=G.regions[i];const da=accOf(R.owner,R.cat);let s=P.p[R.cat]-da*.8+R.value/2000+Math.random()*.25;if(R.castle)s+=(3-R.towers)*.25-.35;return{i,s}}).sort((x,y)=>y.s-x.s)[0].i}
  setHL([],ri);scrollToRegions([ri]);await sleep(500);
  const R=G.regions[ri],d=R.owner;
  if(R.castle){
    while(R.towers>0){const o=await duel(pid,d,ri);hideCard();
      if(o==='att'){R.towers--;redrawAll();if(R.towers>0){toast(t('tower',{r:R.name,n:R.towers}));await sleep(900)}}
      else{if(o==='def'){R.value+=100;toast(t('held',{d:pname(d),r:R.name}))}else toast(t('none',{r:R.name}));redrawAll();break}}
    if(R.towers===0){G.regions.forEach(x=>{if(x.owner===d)x.owner=pid});R.castle=false;G.players[d].alive=false;redrawAll();toast(t('fell',{a:pname(pid),d:pname(d)}));setStatus(()=>[t('fell',{a:pname(pid),d:pname(d)}),'']);await sleep(1600)}
  }else{
    const o=await duel(pid,d,ri);hideCard();
    if(o==='att'){R.owner=pid;toast(t('took',{a:pname(pid),r:R.name}))}else if(o==='def'){R.value+=100;toast(t('held',{d:pname(d),r:R.name}))}else toast(t('none',{r:R.name}));
    redrawAll();
  }
  clearHL();await sleep(900);
}
async function run(){
  newGame();redrawAll();renderPhase();
  G.phase='expand';
  while(freeR().length){G.round++;renderPhase();setActive(-1);setStatus(()=>[t('waitExpand'),'']);await sleep(500);
    const rk=await askEst(nextEst(),alive(),t('est'),t('all'));hideCard();
    for(const [pid,n] of [[rk[0],2],[rk[1],1]])for(let k=0;k<n;k++){if(!freeR().length)break;await pickRegion(pid,n-k)}
  }
  G.phase='war';
  for(let rd=1;rd<=4;rd++){G.round=rd;renderPhase();const order=[0,1,2].map(k=>(k+rd-1)%3);
    for(const pid of order){if(!G.players[0].alive||alive().length<2)break;if(G.players[pid].alive)await attackTurn(pid)}
    if(!G.players[0].alive||alive().length<2)break}
  G.phase='end';setActive(-1);renderPhase();showEnd();
}
function showEnd(){
  const rk=[0,1,2].sort((a,b)=>(G.players[b].alive-G.players[a].alive)||score(b)-score(a));
  const draw=()=>{const head=!G.players[0].alive?t('youLost'):rk[0]===0?t('win'):t('lose',{p:pname(rk[0])});
    showCard(`<div class="endt">${esc(head)}</div><div class="rows">${rk.map((p,k)=>`<div class="row${k===0?' first':''}" style="--c:${G.players[p].color}"><span class="rk">${k+1}</span><span>${esc(pname(p))}${G.players[p].alive?'':' · '+t('out')}</span><span class="g">${fmtN(score(p))}</span><span class="df">${t('score')}</span></div>`).join('')}</div><button class="cta" id="again">${t('again')}</button>`);
    $('#again').onclick=()=>{hideCard();run()}};
  ovRerender=draw;draw();setStatus(()=>[t('final'),'']);
}
function showStart(){
  const draw=()=>{showCard(`<div class="cardtop"><div class="hero"><h1>PUSULA</h1><p>${t('tag')}</p><p class="qu">“${t('quote')}”<span>— Atatürk</span></p></div><div class="langs">${LANGS.map(l=>`<button data-l="${l}" aria-pressed="${l===lang}">${l.toUpperCase()}</button>`).join('')}</div></div>
    <ol class="rules"><li>${t('r1')}</li><li>${t('r2')}</li><li>${t('r3')}</li><li>${t('r4')}</li><li>${t('r5')}</li></ol><button class="cta" id="go">${t('start')}</button>`);
    $('#go').onclick=()=>{hideCard();run()}};
  ovRerender=draw;draw();
}

/* ===================== boot ===================== */
document.documentElement.lang=lang;
buildMap();renderLangs();$('#sub').textContent=t('sub');renderLegend();renderZoom();renderPhase();
newGame();
document.fonts.load('600 27px "IBM Plex Sans"').catch(()=>{}).then(()=>document.fonts.ready).then(()=>{redrawAll()});
redrawAll();
showStart();
</script>
